<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Swap-system</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="login-page"><form class="panel login-card" method="post"><div class="brand-login"><span class="logo">✓</span><div><strong>SWAP-SYSTEM</strong><small>Arquivo de checklists da produção</small></div></div><p class="eyebrow">ACESSO COMPARTILHADO</p><h1>Entrar no sistema</h1><p class="muted">Uma única conta para criar, arquivar e consultar todos os checklists.</p>{% if error %}<p class="feedback error" role="alert">{{ error }}</p>{% endif %}<label class="field">Login<input name="username" required autocomplete="username" maxlength="50" placeholder="ADM Produção"></label><label class="field">Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="button primary full" type="submit">Entrar no arquivo de checklists</button></form></main></body></html>
