<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Regra Clara</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="login-page"><form class="panel login-card" method="post"><div class="brand-login"><span class="brand-icon">✓</span><div><strong>REGRA CLARA</strong><small>Passagem de turno</small></div></div><p class="eyebrow">ACESSO INDIVIDUAL</p><h1>Entrar no sistema</h1><p class="muted">Use seu login e sua senha fornecidos pelo administrador.</p>{% if error %}<p class="feedback error">{{ error }}</p>{% endif %}<label class="field">Login<input name="username" required autocomplete="username" maxlength="50"></label><label class="field">Senha<input name="password" type="password" required autocomplete="current-password"></label><button class="button primary full" type="submit">Acessar checklist</button><small class="muted">Somos um time — há 1 único bastão.</small></form></main></body></html>
